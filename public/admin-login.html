<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0b10">
    <title>تسجيل الدخول — لوحة التحكم</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app">
        <div class="login-wrap">
            <div class="card" style="text-align:center">
                <div style="margin-bottom:18px">
                    <span class="icon xl" style="color:var(--primary)"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
                </div>
                <h2 style="font-size:1.1rem;margin-bottom:16px">لوحة التحكم</h2>
                <form method="POST" action="/admin/login">
                    <div class="form-row">
                        <input type="password" name="password" class="input" placeholder="كلمة المرور" required autocomplete="current-password" dir="ltr" style="text-align:center">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">دخول</button>
                </form>
                <script>
                    if (new URLSearchParams(location.search).has('error')) {
                        const e = document.createElement('div');
                        e.style.cssText = 'color:var(--danger);font-size:0.82rem;margin-top:10px';
                        e.textContent = 'كلمة المرور غير صحيحة';
                        document.querySelector('form').appendChild(e);
                    }
                </script>
            </div>
        </div>
    </div>
</body>
</html>

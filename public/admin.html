<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="لوحة تحكم نظام حجز الشمامسة">
    <meta name="theme-color" content="#0a0b10">
    <title>لوحة التحكم — نظام حجز الشمامسة</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="toast-wrap" id="toasts"></div>
    <div class="loader-overlay" id="loader" style="display:none"><div class="spinner"></div></div>

    <div class="app admin-app">
        <header class="header" style="padding-bottom:8px">
            <h1>لوحة التحكم</h1>
            <p class="subtitle" style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap">
                <a href="/" style="color:var(--text-dim);text-decoration:none;font-size:0.82rem">صفحة الحجز</a>
                <a href="/admin/logout" style="color:var(--danger);text-decoration:none;font-size:0.82rem">خروج</a>
            </p>
        </header>

        <div class="stats-row" id="stats">
            <div class="stat-box"><div class="stat-num" id="s-deacons">0</div><div class="stat-lbl">الشمامسة</div></div>
            <div class="stat-box"><div class="stat-num" id="s-bookings">0</div><div class="stat-lbl">الحجوزات</div></div>
            <div class="stat-box"><div class="stat-num" id="s-church">0</div><div class="stat-lbl">الكنيسة</div></div>
            <div class="stat-box"><div class="stat-num" id="s-club">0</div><div class="stat-lbl">النادي</div></div>
        </div>

        <div class="admin-tabs" id="tabs">
            <button class="admin-tab active" data-tab="tab-bookings">الحجوزات</button>
            <button class="admin-tab" data-tab="tab-days">الأيام</button>
            <button class="admin-tab" data-tab="tab-settings">الإعدادات</button>
        </div>

        <!-- Bookings -->
        <div class="admin-panel active" id="tab-bookings">
            <div class="card">
                <div class="filters">
                    <select id="flt-day"><option value="">كل الأيام</option></select>
                    <select id="flt-loc">
                        <option value="">كل الأماكن</option>
                        <option value="church">الكنيسة</option>
                        <option value="club">النادي</option>
                    </select>
                    <select id="flt-stage">
                        <option value="">كل المراحل</option>
                        <option value="خامسة و سادسة">خامسة و سادسة</option>
                        <option value="اعدادي">إعدادي</option>
                        <option value="ثانوي">ثانوي</option>
                        <option value="شباب">شباب</option>
                        <option value="خريجين">خريجين</option>
                    </select>
                    <select id="flt-rank">
                        <option value="">كل الرتب</option>
                        <option value="ابصالتوس">ابصالتوس</option>
                        <option value="اغنسطس">اغنسطس</option>
                        <option value="ايبوذياكون">ايبوذياكون</option>
                        <option value="ذياكون">ذياكون</option>
                        <option value="ارشيذياكون">ارشيذياكون</option>
                    </select>
                    <button class="btn btn-sm btn-ghost" id="export-btn">تصدير CSV</button>
                </div>
                <div id="cards-container"></div>
                <div id="count-label" style="font-size:0.75rem;color:var(--text-muted);margin-top:8px"></div>
            </div>
        </div>

        <!-- Days -->
        <div class="admin-panel" id="tab-days">
            <div class="card">
                <div class="card-head">
                    <div class="badge-icon"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span></div>
                    <h2>إدارة الأيام</h2>
                </div>
                <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
                    <input type="date" id="new-day-date" class="input" style="flex:1;min-width:130px">
                    <input type="text" id="new-day-label" class="input" placeholder="وصف اليوم" style="flex:1;min-width:130px">
                    <button class="btn btn-primary btn-sm" id="add-day-btn">إضافة</button>
                </div>
                <div id="days-list"></div>
            </div>
        </div>

        <!-- Settings -->
        <div class="admin-panel" id="tab-settings">
            <div class="card">
                <div class="card-head">
                    <div class="badge-icon"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span></div>
                    <h2>الإعدادات</h2>
                </div>
                <div class="form-row">
                    <label for="cfg-cap">سعة الكنيسة (لكل يوم)</label>
                    <input type="number" id="cfg-cap" class="input" min="1" dir="ltr" style="text-align:right" inputmode="numeric">
                </div>
                <div class="form-row">
                    <label for="cfg-max">الحد الأقصى لحجز الكنيسة لكل شماس</label>
                    <input type="number" id="cfg-max" class="input" min="1" dir="ltr" style="text-align:right" inputmode="numeric">
                </div>
                <div class="form-row">
                    <label for="cfg-pw">كلمة مرور الأدمن</label>
                    <input type="text" id="cfg-pw" class="input" dir="ltr" style="text-align:right">
                </div>
                <button class="btn btn-success" id="save-cfg-btn">حفظ الإعدادات</button>
                <div class="danger-zone">
                    <h3>منطقة خطرة</h3>
                    <p>مسح جميع بيانات الشمامسة والحجوزات نهائياً.</p>
                    <button class="btn btn-outline-danger btn-sm" id="clear-btn">مسح جميع البيانات</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
